name: Fix Unmapped Emails

on:
  workflow_run:
    workflows: ["Sync to Public Repo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scan_range:
        description: 'Git revision range to scan (default: all commits)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    # Only run on sync failure (or manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # SECURITY: This is a privileged workflow (workflow_run + contents/PR write +
      # SYNC_APP token). NEVER pin `ref:` to ${{ github.event.workflow_run.head_sha }}
      # or any other attacker-controllable SHA — that would let a malicious commit
      # inject code into .github/scripts/fix-unmapped-emails-orchestrate.sh and run
      # it with our privileges. (CodeQL: actions/untrusted-checkout/critical —
      # https://codeql.github.com/codeql-query-help/actions/actions-untrusted-checkout-critical/)
      # We deliberately load all scripts from the default branch, which is
      # gate-protected. The orchestrator scans `git log --all` and so naturally
      # covers any unmapped authors that landed on main — including the ones that
      # tripped the upstream Sync failure.
      - name: Checkout default branch (trusted code path)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Detect, merge, and append-or-create
        env:
          # Authenticate gh API calls in resolve-mailmap-entry.sh so candidate
          # GitHub users can actually be looked up (without this, /users and
          # /search/users calls fail and every detection produces only
          # comment-only "needs manual lookup" placeholders).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAILMAP_FILE: .github/sync-mailmap
          SCAN_RANGE: ${{ inputs.scan_range }}
          # Human-readable trigger label embedded in the auto-generated PR
          # body / comment so reviewers know whether this run came from a
          # failed sync or a manual dispatch.
          TRIGGER_LABEL: ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || 'Sync to Public Repo failure' }}
          # Hard contract per ADO 5356762: auto/fix-unmapped-emails-* branches
          # are append-only. The orchestrator must NOT force-push — when an
          # open auto-fix PR exists, new entries are appended as a new commit
          # plus a PR comment, so operator edits mid-review survive.
        run: |
          chmod +x \
            .github/scripts/detect-unmapped-emails.sh \
            .github/scripts/resolve-mailmap-entry.sh \
            .github/scripts/merge-mailmap-additions.sh \
            .github/scripts/fix-unmapped-emails-orchestrate.sh
          bash .github/scripts/fix-unmapped-emails-orchestrate.sh
