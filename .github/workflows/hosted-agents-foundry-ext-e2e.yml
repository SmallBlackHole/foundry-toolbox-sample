# Playwright deploy tests for hosted-agent samples via Microsoft Foundry VS Code extension
#
# Validates that modified hosted-agent samples deploy correctly through the
# Microsoft Foundry VS Code extension ("Microsoft Foundry: Deploy Hosted Agent").
# Runs the Playwright suite against only the samples changed in the PR, using
# FOUNDRY_SAMPLES_INCLUDE to filter discovery. Scheduled/manual full runs split
# samples across a matrix for parallelism.
#
# The Playwright suite, its dependencies, VS Code, and the AI Foundry extension
# are all baked into the prebuilt harness image
# (hostedagente2e.azurecr.io/hosted-agent-deployment), which owns the test code.
# This workflow only provides the samples to test: it checks out the repo and
# runs the baked suite from $HARNESS_DIR with FOUNDRY_SAMPLES_REPO_ROOT pointing
# at the checkout. Rebuild the harness image when the suite or its deps change.
#
# Prerequisites (repo-level vars / secrets):
#   vars:  FOUNDRY_EXT_E2E_ENABLED, FOUNDRY_EXT_CLIENT_ID, FOUNDRY_EXT_TENANT_ID,
#          FOUNDRY_EXT_SUBSCRIPTION_ID, FOUNDRY_EXT_PROJECT_URI,
#          HARNESS_ACR_USERNAME (ACR pull-token name; omit for anonymous pull)
#   secrets: FOUNDRY_EXT_GITHUB_PAT (GitHub PAT for samples that call GitHub APIs)
#            HARNESS_ACR_PASSWORD (ACR pull-token password used to pull the
#                                  harness image; omit for anonymous pull)
name: Hosted Agents Foundry Extension E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "samples/python/hosted-agents/**"
      - "samples/csharp/hosted-agents/**"
      - ".github/workflows/hosted-agents-foundry-ext-e2e.yml"
  schedule:
    # Runs daily at 08:00 Beijing time (00:00 UTC) and tests all hosted-agent samples.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      samples_include:
        description: "Regex filter for FOUNDRY_SAMPLES_INCLUDE"
        required: false
        type: string

concurrency:
  group: hosted-agents-foundry-ext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # OIDC token for az login
  contents: read

jobs:
  # Detect which samples changed
  detect-changes:
    name: Detect changed samples
    runs-on: ubuntu-latest
    if: >-
      vars.FOUNDRY_EXT_E2E_ENABLED == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.fork != true)
    outputs:
      samples_include: ${{ steps.build-filter.outputs.samples_include }}
      sample_matrix: ${{ steps.build-filter.outputs.sample_matrix }}
      has_changes: ${{ steps.build-filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build FOUNDRY_SAMPLES_INCLUDE regex
        id: build-filter
        env:
          INPUT_SAMPLES_INCLUDE: ${{ inputs.samples_include }}
        run: |
          set -euo pipefail

          escape_regex() {
            printf '%s' "$1" | sed 's/[.[\*+?^${}()|]/\\&/g'
          }

          json_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          artifact_slug() {
            printf '%s' "$1" | sed 's#[^A-Za-z0-9._-]#-#g; s/--*/-/g; s/^-*//; s/-*$//' | cut -c1-100
          }

          build_matrix_json_from_dirs() {
            local first=1
            printf '['
            for d in "$@"; do
              local escaped include slug display_name
              escaped=$(escape_regex "$d")
              include="^$escaped$"
              slug=$(artifact_slug "$d")
              display_name=$(printf '%s' "$d" | sed 's#^samples/##; s#hosted-agents/##')

              if [ $first -eq 0 ]; then
                printf ','
              fi
              first=0

              printf '{"sample_path":"%s","sample_include":"%s","artifact_slug":"%s","display_name":"%s"}' \
                "$(json_escape "$d")" \
                "$(json_escape "$include")" \
                "$(json_escape "$slug")" \
                "$(json_escape "$display_name")"
            done
            printf ']'
          }

          build_combined_include_from_dirs() {
            local parts=()
            for d in "$@"; do
              parts+=("^$(escape_regex "$d")$")
            done
            local IFS='|'
            echo "${parts[*]}"
          }

          discover_all_samples() {
            local -n out_ref=$1
            out_ref=()
            for root in samples/python/hosted-agents samples/csharp/hosted-agents; do
              if [ ! -d "$root" ]; then
                continue
              fi
              while IFS= read -r manifest_file; do
                out_ref+=("$(dirname "$manifest_file")")
              done < <(find "$root" -type f -name azure.yaml | sort)
            done
          }

          write_outputs() {
            local samples_include=$1
            local matrix_json=$2

            echo "samples_include=$samples_include" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo 'sample_matrix<<EOF'
              echo "$matrix_json"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          }

          # If manual dispatch with explicit filter, use that directly
          if [ -n "$INPUT_SAMPLES_INCLUDE" ]; then
            manual_filter_json=$(json_escape "$INPUT_SAMPLES_INCLUDE")
            matrix_json="[{\"sample_path\":\"manual-filter\",\"sample_include\":\"$manual_filter_json\",\"artifact_slug\":\"manual-filter\",\"display_name\":\"manual-filter\"}]"
            write_outputs "$INPUT_SAMPLES_INCLUDE" "$matrix_json"
            echo "Using manual filter: $INPUT_SAMPLES_INCLUDE"
            exit 0
          fi

          # For PRs, find changed files relative to the base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Scheduled/manual run without filter — test all samples
            discover_all_samples unique_dirs
            matrix_json=$(build_matrix_json_from_dirs "${unique_dirs[@]}")
            write_outputs "." "$matrix_json"
            echo "Scheduled/manual run without filter — testing ${#unique_dirs[@]} hosted-agent samples"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          # If this workflow file itself changed, test every hosted-agent sample.
          # A workflow/harness change can affect all samples, so the per-sample
          # diff isn't trustworthy and we must run the full set.
          if echo "$changed_files" | grep -qx '.github/workflows/hosted-agents-foundry-ext-e2e.yml'; then
            discover_all_samples unique_dirs
            matrix_json=$(build_matrix_json_from_dirs "${unique_dirs[@]}")
            write_outputs "." "$matrix_json"
            echo "Workflow file changed — testing ${#unique_dirs[@]} hosted-agent samples"
            exit 0
          fi

          # Collect unique sample directories that contain changes.
          # A sample directory is the deepest ancestor under
          # samples/<lang>/hosted-agents/ that has azure.yaml.
          sample_dirs=()
          while IFS= read -r file; do
            # Only care about files under hosted-agents paths
            if [[ "$file" != samples/python/hosted-agents/* ]] && \
               [[ "$file" != samples/csharp/hosted-agents/* ]]; then
              continue
            fi

            # Walk up from the file's directory to find the sample root
            dir=$(dirname "$file")
            while [ "$dir" != "." ] && [ "$dir" != "samples/python/hosted-agents" ] && [ "$dir" != "samples/csharp/hosted-agents" ]; do
              if [ -f "$dir/azure.yaml" ]; then
                sample_dirs+=("$dir")
                break
              fi
              dir=$(dirname "$dir")
            done
          done <<< "$changed_files"

          # Deduplicate
          if [ ${#sample_dirs[@]} -gt 0 ]; then
            unique_dirs=($(printf '%s\n' "${sample_dirs[@]}" | sort -u))
          else
            unique_dirs=()
          fi

          if [ ${#unique_dirs[@]} -eq 0 ]; then
            discover_all_samples unique_dirs
            fallback_sample='.'
            matrix_json=$(build_matrix_json_from_dirs "${unique_dirs[@]}")
            echo "No hosted-agent sample changes detected — falling back to all hosted-agent samples"
            write_outputs "$fallback_sample" "$matrix_json"
            exit 0
          fi

          # Build one matrix job per changed sample path.
          for d in "${unique_dirs[@]}"; do
            echo "  Changed sample: $d"
          done

          # Join with | to form alternation
          regex=$(build_combined_include_from_dirs "${unique_dirs[@]}")
          matrix_json=$(build_matrix_json_from_dirs "${unique_dirs[@]}")

          write_outputs "$regex" "$matrix_json"
          echo "FOUNDRY_SAMPLES_INCLUDE regex: $regex"

  # Run Playwright tests
  playwright:
    name: ${{ matrix.display_name }}
    needs: detect-changes
    runs-on: ubuntu-latest
    # Prebuilt harness image with Playwright browsers + xvfb + Node + Azure CLI +
    # VS Code + the AI Foundry extension all baked in, so the job skips the slow
    # per-run environment setup. The image is built and published weekly from
    # https://github.com/huimiao_microsoft/hosted-agent-deployment and published to Azure
    # Container Registry (hostedagente2e.azurecr.io/hosted-agent-deployment).
    #
    # A job-level container image is pulled before any step runs, so OIDC can't
    # authenticate the pull. Supply a pull-scoped ACR token via
    # vars.HARNESS_ACR_USERNAME (token name) + secrets.HARNESS_ACR_PASSWORD, or
    # enable anonymous pull on the registry and delete the `credentials:` block.
    # Forks can't read secrets, but detect-changes already gates this job to
    # non-fork PRs.
    container:
      image: hostedagente2e.azurecr.io/hosted-agent-deployment:latest
      credentials:
        username: ${{ vars.HARNESS_ACR_USERNAME }}
        password: ${{ secrets.HARNESS_ACR_PASSWORD }}
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.sample_matrix) }}
    env:
      AI_FOUNDRY_PROJECT_URI: ${{ vars.FOUNDRY_EXT_PROJECT_URI }}
      AI_FOUNDRY_TENANT_ID: ${{ vars.FOUNDRY_EXT_TENANT_ID }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      # Used by samples/csharp/hosted-agents/agent-framework/azure-search-rag/azure.yaml
      # to build AZURE_SEARCH_ENDPOINT=https://<name>.search.windows.net. The
      # service must contain the `contoso-outdoors` index.
      AZURE_AI_SEARCH_SERVICE_NAME: ${{ vars.AZURE_AI_SEARCH_SERVICE_NAME }}
      # Used by samples/csharp/hosted-agents/agent-framework/foundry-memory-rag/azure.yaml.
      AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_EMBEDDING_DEPLOYMENT_NAME }}
      TOOLBOX_NAME: e2e-toolbox
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ vars.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
      FOUNDRY_SAMPLES_INCLUDE: ${{ matrix.sample_include }}

    steps:
      - uses: actions/checkout@v4

      # Inject the real RAI policy ARM ID into the sample's azure.yaml before the
      # Playwright deploy reads it. The committed sample carries a documented
      # PLACEHOLDER ARM ID (no real resource details); replace only that exact
      # placeholder, so this is a no-op for every sample that lacks it. Fail fast
      # if the placeholder is present but FOUNDRY_EXT_RAI_POLICY_ID is unset.
      - name: Inject RAI policy into azure.yaml
        env:
          RAI_POLICY_ID: ${{ vars.FOUNDRY_EXT_RAI_POLICY_ID }}
          SAMPLE_PATH: ${{ matrix.sample_path }}
        run: |
          MANIFEST_YAML="$SAMPLE_PATH/azure.yaml"
          [ -f "$MANIFEST_YAML" ] || { echo "No azure.yaml at $MANIFEST_YAML; skipping."; exit 0; }
          python3 - "$MANIFEST_YAML" <<'PYEOF'
          import os, re, sys
          path = sys.argv[1]
          placeholder = ("/subscriptions/<subscription-id>/resourceGroups/<resource-group>"
                         "/providers/Microsoft.CognitiveServices/accounts/<account>"
                         "/raiPolicies/<policy-name>")
          policy = os.environ.get("RAI_POLICY_ID", "").strip()
          with open(path, encoding="utf-8") as f:
              text = f.read()
          if placeholder not in text:
              print("No RAI policy placeholder in azure.yaml; skipping policy injection.")
              sys.exit(0)
          if not policy:
              print("::error::azure.yaml has an RAI policy placeholder but the "
                    "FOUNDRY_EXT_RAI_POLICY_ID repo variable is not set.")
              sys.exit(1)
          if not re.fullmatch(
                  r"/subscriptions/[^/]+/resourceGroups/[^/]+/providers/"
                  r"Microsoft\.CognitiveServices/accounts/[^/]+/raiPolicies/[^/]+",
                  policy, re.IGNORECASE):
              print("::error::FOUNDRY_EXT_RAI_POLICY_ID must be the full ARM ID of a "
                    "Microsoft.CognitiveServices raiPolicies resource.")
              sys.exit(1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text.replace(placeholder, policy))
          print("Injected RAI policy into azure.yaml (policy: %s)." % policy.rsplit("/", 1)[-1])
          PYEOF

      - name: Validate required variables
        shell: bash
        run: |
          missing=()
          [ -z "$AI_FOUNDRY_PROJECT_URI" ] && missing+=("FOUNDRY_EXT_PROJECT_URI")
          [ -z "${{ vars.FOUNDRY_EXT_CLIENT_ID }}" ] && missing+=("FOUNDRY_EXT_CLIENT_ID")
          [ -z "${{ vars.FOUNDRY_EXT_TENANT_ID }}" ] && missing+=("FOUNDRY_EXT_TENANT_ID")
          [ -z "${{ vars.FOUNDRY_EXT_SUBSCRIPTION_ID }}" ] && missing+=("FOUNDRY_EXT_SUBSCRIPTION_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required variables: ${missing[*]}"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.FOUNDRY_EXT_CLIENT_ID }}
          tenant-id: ${{ vars.FOUNDRY_EXT_TENANT_ID }}
          subscription-id: ${{ vars.FOUNDRY_EXT_SUBSCRIPTION_ID }}

      - name: Check CI identity permissions
        shell: bash
        run: |
          set -euo pipefail

          project_uri="${AI_FOUNDRY_PROJECT_URI#/resource}"
          subscription_id=$(echo "$project_uri" | sed -n 's#^/subscriptions/\([^/]*\)/.*#\1#p')
          resource_group=$(echo "$project_uri" | sed -n 's#^/subscriptions/[^/]*/resourceGroups/\([^/]*\)/.*#\1#p')

          if [ -z "$subscription_id" ] || [ -z "$resource_group" ]; then
            echo "::error::Unable to parse FOUNDRY_EXT_PROJECT_URI: $AI_FOUNDRY_PROJECT_URI"
            exit 1
          fi

          rg_scope="/subscriptions/$subscription_id/resourceGroups/$resource_group"

          echo "Azure account after OIDC login:"
          az account show --query '{subscription:id, tenant:tenantId, user:user.name, userType:user.type}' --output json

          echo "Role assignments for the CI identity on $rg_scope, including inherited assignments:"
          set +e
          role_output=$(az role assignment list \
            --assignee "${{ vars.FOUNDRY_EXT_CLIENT_ID }}" \
            --scope "$rg_scope" \
            --include-inherited \
            --query '[].{role:roleDefinitionName, principalType:principalType, scope:scope}' \
            --output table 2>&1)
          role_status=$?
          set -e

          if [ $role_status -ne 0 ]; then
            echo "::warning::Unable to list role assignments for the CI identity. This can happen when the identity cannot query Microsoft Graph or role assignments."
            echo "$role_output"
          elif [ -z "$(echo "$role_output" | tr -d '[:space:]')" ]; then
            echo "::warning::No role assignments found for the CI identity on $rg_scope or inherited scopes."
          else
            echo "$role_output"
          fi

      - name: Preflight default ACR access
        shell: bash
        run: |
          set -euo pipefail

          project_uri="${AI_FOUNDRY_PROJECT_URI#/resource}"
          subscription_id=$(echo "$project_uri" | sed -n 's#^/subscriptions/\([^/]*\)/.*#\1#p')
          resource_group=$(echo "$project_uri" | sed -n 's#^/subscriptions/[^/]*/resourceGroups/\([^/]*\)/.*#\1#p')
          project_name=$(echo "$project_uri" | sed -n 's#^.*/projects/\([^/]*\)$#\1#p')

          if [ -z "$subscription_id" ] || [ -z "$resource_group" ] || [ -z "$project_name" ]; then
            echo "::error::Unable to parse FOUNDRY_EXT_PROJECT_URI: $AI_FOUNDRY_PROJECT_URI"
            exit 1
          fi

          sub_part=$(echo "$subscription_id" | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-7)
          project_part=$(echo "$project_name" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-20)
          rg_hash=$(printf '%s' "$resource_group" | sha256sum | cut -c1-4)
          acr_name="${sub_part}${project_part}${rg_hash}acr"

          echo "Default ACR expected by the extension: $acr_name"

          set +e
          acr_output=$(az acr show \
            --subscription "$subscription_id" \
            --resource-group "$resource_group" \
            --name "$acr_name" \
            --query '{name:name, loginServer:loginServer}' \
            --output json 2>&1)
          acr_status=$?
          set -e

          if [ $acr_status -eq 0 ]; then
            echo "Default ACR is readable: $acr_output"
          elif echo "$acr_output" | grep -Eiq 'ResourceNotFound|could not be found|was not found'; then
            echo "Default ACR does not exist yet; the extension will attempt to create it."
          else
            echo "::error::Unable to read default ACR $acr_name in resource group $resource_group."
            echo "$acr_output"
            echo "Grant the workflow identity read/create access to the resource group, plus role assignment permission if the extension must create or update ACR roles."
            exit $acr_status
          fi

      - name: Verify baked harness suite
        shell: bash
        run: |
          set -euo pipefail
          # The suite (specs/fixtures/helpers + node_modules) is baked into the
          # harness image under $HARNESS_DIR. Fail clearly if the image is the
          # wrong one / out of date, instead of a confusing runtime error.
          harness_dir="${HARNESS_DIR:-/opt/harness}"
          for p in node_modules playwright.config.ts specs fixtures helpers; do
            if [ ! -e "$harness_dir/$p" ]; then
              echo "::error::Baked harness suite is incomplete: missing $harness_dir/$p. Rebuild the harness image (see https://github.com/huimiao_microsoft/hosted-agent-deployment)."
              exit 1
            fi
          done
          echo "Baked harness suite present at $harness_dir."

      - name: Run Playwright tests
        shell: bash
        run: |
          set -euo pipefail
          # Run the baked suite in place; point sample discovery at this
          # checkout (the only thing this repo provides).
          cd "${HARNESS_DIR:-/opt/harness}"
          export FOUNDRY_SAMPLES_REPO_ROOT="$GITHUB_WORKSPACE"
          xvfb-run --auto-servernum npx playwright test
        env:
          FOUNDRY_SAMPLES_INCLUDE: ${{ matrix.sample_include }}
          AI_FOUNDRY_PROJECT_URI: ${{ vars.FOUNDRY_EXT_PROJECT_URI }}
          AI_FOUNDRY_TENANT_ID: ${{ vars.FOUNDRY_EXT_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.FOUNDRY_EXT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.FOUNDRY_EXT_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.FOUNDRY_EXT_SUBSCRIPTION_ID }}
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ vars.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FOUNDRY_EXT_GITHUB_PAT }}
          GITHUB_PAT: ${{ secrets.FOUNDRY_EXT_GITHUB_PAT }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.artifact_slug }}
          path: /opt/harness/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-${{ matrix.artifact_slug }}
          path: /opt/harness/test-results/
          retention-days: 7
