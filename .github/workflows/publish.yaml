name: Release
# TODO: change trigger to push to 'ci/*' branches when create pr permission is available
on: workflow_dispatch
jobs:
  make-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Create Pull Request
        run: gh pr create --head ${{ github.ref }} --base main --title "Add samples from ${{ github.ref }}" --body "Automated PR from ${{ github.ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}