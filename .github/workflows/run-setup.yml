name: Run Setup

on:
  push:
    branches: [main]
    paths:
      - infrastructure/infrastructure-setup-bicep/**
  pull_request:
    branches: [main]
    paths:
      - infrastructure/infrastructure-setup-bicep/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          # Always check out from this repo. For fork PRs the head commit is
          # available via refs/pull/N/head on the upstream, so we do not need
          # to fetch the fork directly. This is important when the fork is
          # private and the default GITHUB_TOKEN cannot read it (404).
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install Bicep
        run: |
          INSTALL_PATH="$RUNNER_TEMP/bicep"
          BICEP_PATH="$RUNNER_TEMP/bicep/bicep"
          mkdir -p "$INSTALL_PATH"
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep "$INSTALL_PATH"
          echo "BICEP_PATH=$BICEP_PATH" >> $GITHUB_ENV
          $BICEP_PATH --version

      - name: Determine changed main.bicep files
        id: changes
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          EVENT="${{ github.event_name }}"
          echo "Event: $EVENT"

          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            # workflow_dispatch: use last commit as best-effort
            BASE="$(git rev-parse HEAD~1 || echo '')"
            HEAD="$(git rev-parse HEAD)"
          fi

          echo "Diff range: ${BASE}..${HEAD}"

          # Only rebuild when main.bicep changes
          if [ -n "$BASE" ]; then
            MODIFIED=$(git diff --name-only "$BASE" "$HEAD" \
              | grep -E "^infrastructure/infrastructure-setup-bicep/.*/main\.bicep$" || true)
          else
            MODIFIED=$(git show --name-only --pretty="" -1 \
              | grep -E "^infrastructure/infrastructure-setup-bicep/.*/main\.bicep$" || true)
          fi

          if [ -z "$MODIFIED" ]; then
            echo "No relevant Bicep changes detected."
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed main.bicep files:"
          echo "$MODIFIED"

          # Output as newline-delimited list
          {
            echo "files<<EOF"
            echo "$MODIFIED"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build changed Bicep files -> azuredeploy.json
        if: steps.changes.outputs.files != ''
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          while IFS= read -r BICEP_FILE; do
            OUTFILE="$(dirname "$BICEP_FILE")/azuredeploy.json"
            echo "Building: $BICEP_FILE -> $OUTFILE"
            $BICEP_PATH build "$BICEP_FILE" --outfile "$OUTFILE"
          done <<< "${{ steps.changes.outputs.files }}"

      - name: Commit + push changes back to branch (PR) or open a fixup PR (push)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          git config --global user.email "foundry-samples@noreply.github.com"
          git config --global user.name "foundry-samples automation"

          git add -A

          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automatic fixes"

          EVENT="${{ github.event_name }}"

          # If PR is from a fork, pushing will be rejected. Detect and skip.
          if [ "$EVENT" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "PR is from a fork; cannot push changes back to fork branch. Skipping push."
              exit 0
            fi
            BRANCH="${{ github.head_ref }}"
            echo "Pushing fixes to PR branch: $BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
            exit 0
          fi

          # push / workflow_dispatch on a protected branch (typically main):
          # branch protection rejects direct pushes by this workflow's bot
          # identity, so push to a dedicated branch and open a PR back to the
          # source ref. This makes regeneration auditable and reviewable, and
          # avoids the silent-failure mode where every push event left
          # azuredeploy.json stale on main without any visible signal.
          #
          # See ADO 5293956 for background. The corresponding public-side
          # copy (delivered via public-overlay/.github/workflows/run-setup.yml)
          # disables the push/PR triggers entirely; regeneration is owned
          # upstream by this private repo only.
          SRC_BRANCH="${{ github.ref_name }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          AUTO_BRANCH="auto/regenerate-azuredeploy-${SHORT_SHA}"
          echo "Pushing fixes to: $AUTO_BRANCH (will open PR back to $SRC_BRANCH)"
          git push origin "HEAD:refs/heads/$AUTO_BRANCH"

          PR_BODY="Automated regeneration of \`azuredeploy.json\` from \`main.bicep\` changes on \`$SRC_BRANCH\` (commit $SHORT_SHA).

          Opened by \`.github/workflows/run-setup.yml\` because branch protection
          on \`$SRC_BRANCH\` blocks direct pushes by the workflow identity.

          Review the diff, then merge to land the regenerated JSON on \`$SRC_BRANCH\`.

          Refs: ADO 5293956"

          # Tolerate "PR already exists" if the workflow re-ran for the same SHA.
          if ! gh pr create \
                --base "$SRC_BRANCH" \
                --head "$AUTO_BRANCH" \
                --title "Automatic fixes: regenerate azuredeploy.json (${SHORT_SHA})" \
                --body "$PR_BODY" 2>&1 | tee /tmp/pr-create.out; then
            if grep -q "already exists" /tmp/pr-create.out; then
              echo "PR for $AUTO_BRANCH already exists — leaving in place."
            else
              echo "::error::gh pr create failed; see output above"
              exit 1
            fi
          fi