name: Sync to Public Repo

on:
  schedule:
    - cron: '0 6 * * *' # Nightly at 6:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: builds the sync branch and pushes it but does NOT create a PR or update marks cache.'
        required: false
        type: boolean
        default: false
      force_full:
        description: 'Force a full re-export (discards marks cache).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-to-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for fast-export
          path: private-repo

      - name: Read sync config
        id: config
        run: |
          CONFIG_FILE="private-repo/.github/sync-config.json"
          echo "owner=$(jq -r '.public_repo.owner' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.public_repo.name' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "branch_prefix=$(jq -r '.sync_branch_prefix' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: public-repo
          fetch-depth: 0

      - name: Compute marks cache key
        id: cache-key
        working-directory: private-repo
        run: |
          ROOT_SHA=$(git rev-list --max-parents=0 HEAD | head -1)
          echo "root_sha=$ROOT_SHA" >> "$GITHUB_OUTPUT"
          echo "key=sync-marks-${ROOT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore marks cache
        id: marks-cache
        uses: actions/cache/restore@v4
        with:
          path: marks-dir
          key: ${{ steps.cache-key.outputs.key }}

      - name: Prepare marks directory
        run: mkdir -p marks-dir

      - name: Compute branch name
        id: branch
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            BRANCH="sync/dry-run-$(date -u +%Y%m%d-%H%M%S)"
          else
            BRANCH="${{ steps.config.outputs.branch_prefix }}-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run sync pipeline
        id: sync
        env:
          PRIVATE_REPO: ${{ github.workspace }}/private-repo
          PUBLIC_REPO: ${{ github.workspace }}/public-repo
          MARKS_DIR: ${{ github.workspace }}/marks-dir
          MAILMAP_FILE: ${{ github.workspace }}/private-repo/.github/sync-mailmap
          CONFIG_FILE: ${{ github.workspace }}/private-repo/.github/sync-config.json
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          SOURCE_REF: HEAD
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_FULL: ${{ inputs.force_full && '1' || '0' }}
        run: bash private-repo/.github/scripts/sync-core.sh

      - name: Push sync branch
        if: ${{ steps.sync.outputs.has_changes == 'true' }}
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Close stale sync PRs
        if: ${{ inputs.dry_run != true && steps.sync.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"
          PREFIX="${{ steps.config.outputs.branch_prefix }}"

          # Close any open sync PRs from previous runs. With direct-merge, a
          # successful sync run merges its PR before exiting; an open sync PR
          # here means a previous run timed out or failed. Close and supersede.
          STALE=$(gh pr list --repo "$REPO" --state open \
            --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"${PREFIX}\")) | .number")

          for pr in $STALE; do
            echo "Closing stale sync PR #${pr}"
            gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Superseded by a newer sync."
          done

      - name: Create PR and merge directly as sync app
        if: ${{ inputs.dry_run != true && steps.sync.outputs.has_changes == 'true' }}
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Tunables for wait-and-merge.sh; defaults are 600s timeout / 15s poll.
          MERGE_POLL_TIMEOUT: '600'
          MERGE_POLL_INTERVAL: '15'
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"
          ROLLBACK_SHA="${{ steps.sync.outputs.public_head_before }}"

          PR_BODY="Automated sync from private repo.

          **Synced commits:** ${{ steps.sync.outputs.commit_count }}
          **Authors:** ${{ steps.sync.outputs.authors }}

          **Rollback point:** \`${ROLLBACK_SHA}\` — to revert, force-push this SHA to \`main\` and clear the sync-marks cache.

          Triggered by: \`${{ github.event_name }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Automated sync from private repo ($(date +%Y-%m-%d))" \
            --body "$PR_BODY")

          echo "Created: $PR_URL"

          # Use wait-and-merge.sh (poll-then-direct-merge) instead of
          # `gh pr merge --auto`. Auto-merge fires from a system process that
          # does NOT inherit the app's ruleset bypass; calling `gh pr merge`
          # directly here merges as the app token so the bypass applies.
          # Background: foundry-samples-pr#195
          bash "$GITHUB_WORKSPACE/private-repo/.github/scripts/wait-and-merge.sh" \
            "$PR_URL" "$REPO"

      - name: Save marks cache
        if: ${{ inputs.dry_run != true && steps.sync.outputs.has_changes == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: marks-dir
          key: ${{ steps.cache-key.outputs.key }}

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "## Dry Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Sync branch: \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commits synced: ${{ steps.sync.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Authors: ${{ steps.sync.outputs.authors }}" >> $GITHUB_STEP_SUMMARY
          echo "- Has changes: ${{ steps.sync.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No PR created and marks cache NOT updated. Branch was pushed for inspection." >> $GITHUB_STEP_SUMMARY
