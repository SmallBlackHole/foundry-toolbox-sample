name: Sync to Public Repo

on:
  schedule:
    - cron: '0 6 * * *' # Nightly at 6:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for commit replay
          path: private-repo

      - name: Read sync config
        id: config
        run: |
          CONFIG_FILE="private-repo/.github/sync-config.json"
          echo "owner=$(jq -r '.public_repo.owner' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.public_repo.name' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "branch_prefix=$(jq -r '.sync_branch_prefix' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: public-repo

      - name: Prepare sync branch
        id: branch
        working-directory: public-repo
        run: |
          BRANCH="${{ steps.config.outputs.branch_prefix }}-$(date -u +%Y%m%d-%H%M%S)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

      - name: Replay commits with authorship
        id: replay
        run: |
          bash private-repo/.github/scripts/replay-commits.sh \
            private-repo public-repo private-repo/.github/sync-config.json \
            >> "$GITHUB_OUTPUT"

      - name: Close stale sync PRs
        if: steps.replay.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"
          PREFIX="${{ steps.config.outputs.branch_prefix }}"

          # Find open PRs from sync branches
          OPEN_PRS=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"${PREFIX}\")) | .number")

          for pr in $OPEN_PRS; do
            echo "Closing stale sync PR #${pr}"
            gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Superseded by a newer sync."
          done

      - name: Push and create PR
        if: steps.replay.outputs.has_changes == 'true'
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"

          git push origin "$BRANCH"

          PR_BODY="This PR was automatically generated by the repo sync workflow.

          **Review carefully before merging.** Verify no internal content was included.

          Triggered by: \`${{ github.event_name }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Automated sync from private repo ($(date +%Y-%m-%d))" \
            --body "$PR_BODY"
