name: Test mirror-back helper

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/tests/test-mirror-back.sh'
      - '.github/workflows/test-mirror-back.yml'
      - 'public-overlay/.github/scripts/mirror-back.sh'
      - 'public-overlay/.github/workflows/mirror-back.yml'

  workflow_dispatch:

jobs:
  test-mirror-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test Runner"

      - name: Run mirror-back tests
        run: bash .github/tests/test-mirror-back.sh
