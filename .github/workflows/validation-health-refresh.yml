name: Validation Health Refresh

# Daily cron + manual dispatch. NOT triggered by sync; see
# docs/validation-reporting-decisions.md Q3 for rationale (sync-piggyback
# was dropped to sidestep the verify-sync checkout race + the contents:read
# permission on sync-to-public.yml — neither of which we want to touch).
#
# Single writer enforced by workflow-level concurrency group. Creates or updates
# a PR to merge the regenerated dashboard into main.

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC, ~30 min after the nightly sync runs.
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: read    # Needs to read the combined commit-status payload.

concurrency:
  group: validation-health-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve target SHA
        id: sha
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rendering health board for $sha"

      - name: Render Validation Health Board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p internal/dashboards
          bash .github/scripts/render-validation-health.sh \
            "${{ github.repository }}" \
            "${{ steps.sha.outputs.sha }}" \
            internal/dashboards/validation-health.md \
            "$GITHUB_WORKSPACE"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- internal/dashboards/validation-health.md; then
            echo "No changes — dashboard already up-to-date."
            exit 0
          fi

          BRANCH="auto/validation-health-refresh"

          git checkout -b "$BRANCH"
          git add internal/dashboards/validation-health.md
          git commit -m "chore(dashboards): refresh validation health board" \
            -m "Auto-refresh from validation-health-refresh.yml." \
            -m "Source SHA: ${{ steps.sha.outputs.sha }}"

          git push --force-with-lease origin "$BRANCH"

          # Check if there's already an open PR for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updated existing PR #$EXISTING_PR"
          else
            PR_BODY="Automated refresh of the validation health dashboard.

          Source SHA: \`${{ steps.sha.outputs.sha }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(dashboards): refresh validation health board" \
              --body "$PR_BODY")

            echo "Created: $PR_URL"

            # Auto-merge since this is a trusted automation update
            gh pr merge --auto --squash "$PR_URL"
          fi
